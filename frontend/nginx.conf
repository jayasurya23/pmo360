# Serve the React SPA + reverse-proxy /api → backend container.
upstream backend_api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Increase body size for schedule PDF uploads (can exceed the default 1 MB)
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any path falls back to index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + asset proxy → backend container
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /assets/logo/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        # Cache the logos aggressively — they rarely change.
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Long-cache the built JS/CSS chunks (filename-hashed so cache-busted).
    location ~* \.(?:js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Surface the healthcheck for orchestrators
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
