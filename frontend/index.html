<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo/pmo360_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PMO 360 — Castillo Engineering</title>
    <!-- Jost is self-hosted via @font-face in src/styles/index.css.
         Preload the variable-weight Latin woff2 so first paint isn't
         FOIT-ed by the font request. -->
    <link
      rel="preload"
      href="/fonts/jost/jost-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Apply the saved theme before first paint. React sets this class too,
         but only after hydration — without this a dark-mode user gets a
         white flash on every page load. Kept inline and tiny on purpose:
         an external file would be a second round-trip before paint. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode / storage disabled — light is a fine default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
