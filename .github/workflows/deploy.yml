name: Deploy to Azure Container Apps

# Push-to-deploy: merge to main → build the single-container image in Azure
# Container Registry → roll out a new Container Apps revision. No SSH, no
# local Docker, no manual migration step (the container's entrypoint runs
# `alembic` on boot). Roll back by pointing the app at a previous image tag
# (every build is tagged with its git SHA — see docs/DEPLOYMENT.md).
#
# Auth uses OIDC federated credentials (no long-lived secrets in the repo).
# Required GitHub config (Settings → Secrets and variables → Actions):
#
#   Secrets:
#     AZURE_CLIENT_ID         # the deploy app registration / managed identity
#     AZURE_TENANT_ID
#     AZURE_SUBSCRIPTION_ID
#   Variables:
#     AZURE_RESOURCE_GROUP    # e.g. rg-pmo360
#     ACR_NAME                # e.g. castillopmo360acr  (without .azurecr.io)
#     CONTAINER_APP_NAME      # e.g. pmo360
#
# The SPA's public build config (tenant/client id) lives in
# frontend/.env.production — no build args or extra variables needed here.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required for azure/login OIDC
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false # never abort a deploy mid-rollout

env:
  IMAGE_REPO: pmo360
  # Run JS-based actions on Node 24 — clears the Node 20 deprecation warning
  # (GitHub sunsets Node 20 on the runners in 2026). Belt-and-suspenders with
  # the @v5 action bumps below.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        # az acr build runs the Docker build inside Azure (no Docker needed on
        # the runner). Tags with both the immutable git SHA and :latest.
        # No --build-arg: the SPA's public build config lives in
        # frontend/.env.production (Vite reads it at build time). We avoid
        # build args because some `az acr build` CLI versions mangle the
        # inner docker build command when they're present.
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "${IMAGE_REPO}:${{ github.sha }}" \
            --image "${IMAGE_REPO}:latest" \
            .

      - name: Deploy new revision
        # Pointing the app at the SHA-tagged image creates a new revision and
        # rolls traffic to it. Migrations run automatically via the container
        # entrypoint before the server accepts traffic.
        #
        # We also (re)assert compute + scale every deploy so they're codified
        # here, not just live-edited: min-replicas 1 keeps one replica warm
        # (no scale-to-zero cold start); 1 vCPU / 2 GiB gives PDF/Gantt
        # generation headroom.
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_REPO}:${{ github.sha }}" \
            --cpu 1.0 --memory 2.0Gi \
            --min-replicas 1 --max-replicas 2

      - name: Show rollout
        run: |
          az containerapp revision list \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?properties.active].{revision:name,created:properties.createdTime,traffic:properties.trafficWeight}" \
            -o table
